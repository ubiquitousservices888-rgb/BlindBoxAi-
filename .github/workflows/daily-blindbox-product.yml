name: Daily BlindBox pipeline validation (publishing paused)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    name: Validate daily product data without staging or publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run daily pipeline safety tests
        run: npm run daily:test
      - name: Validate daily pipeline schemas
        run: npm run daily:validate
      - name: Confirm unattended publication is disabled
        run: 'echo "P1 manual-validation phase: no product staging, Buffer publish, or production credentials are used."'
