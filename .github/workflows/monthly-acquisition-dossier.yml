name: Monthly acquisition dossier

on:
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: monthly-acquisition-dossier
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Generate owner-only dossier through GitHub OIDC
        env:
          SUPABASE_URL: https://lazzdoadoqzrzlarerfx.supabase.co
        run: node scripts/generate-acquisition-dossier.mjs
