name: Publish approved review videos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate publisher safety without claiming queue items or posting to Buffer"
        required: true
        default: true
        type: boolean
      publish_channel:
        description: "Single channel for this controlled execution"
        required: true
        type: choice
        options:
          - youtube
          - tiktok
      research_run_id:
        description: "Exact approved row (rv- followed by 16 hex characters)"
        required: true
        type: string
      youtube_audience:
        description: "Owner's audience decision for this exact YouTube video"
        required: true
        default: unreviewed
        type: choice
        options:
          - unreviewed
          - made_for_kids
          - not_made_for_kids

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-approved-review-videos
  cancel-in-progress: false

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      VIDEO_CHANNELS: youtube,tiktok
      PUBLISH_CHANNEL: ${{ inputs.publish_channel }}
      PUBLISH_RESEARCH_RUN_ID: ${{ inputs.research_run_id }}
      YOUTUBE_AUDIENCE: ${{ inputs.youtube_audience }}
      BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure video probe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffprobe >/dev/null 2>&1
          ffprobe -version | head -n 1
      - name: Verify Buffer configuration
        run: |
          if [ -z "$BUFFER_API_TOKEN" ] || [ -z "$BUFFER_ORGANIZATION_ID" ]; then
            echo "::error::Buffer is not configured."
            exit 1
          fi
      - name: Publish next owner-approved review
        run: node scripts/publish-approved-review-queue.mjs
