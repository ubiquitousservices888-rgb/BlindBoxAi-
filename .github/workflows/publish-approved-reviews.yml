name: Publish approved review videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-approved-review-videos
  cancel-in-progress: false

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    env:
      VIDEO_CHANNELS: ${{ vars.VIDEO_CHANNELS || 'youtube,tiktok' }}
      BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Buffer configuration
        run: |
          if [ -z "$BUFFER_API_TOKEN" ] || [ -z "$BUFFER_ORGANIZATION_ID" ]; then
            echo "::error::Buffer is not configured."
            exit 1
          fi
      - name: Publish next owner-approved review
        run: node scripts/publish-approved-review-queue.mjs
