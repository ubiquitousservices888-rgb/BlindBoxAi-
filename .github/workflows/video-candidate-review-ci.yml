name: Video candidate autonomous tests and review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/video-candidate-review-ci.yml'
      - 'lib/daily-video-plan.mjs'
      - 'scripts/daily-video-candidate.mjs'
      - 'scripts/daily-video-candidate.test.mjs'
      - 'docs/daily-video-review.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Automated tests and publishing-safety review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test candidate selection and deduplication
        run: node --test scripts/daily-video-candidate.test.mjs
      - name: Test workflow publishing boundaries
        run: node --test scripts/workflow-publish-safety.test.mjs
      - name: Test existing video pipeline
        run: npm run video:test
      - name: Review for unsafe external actions
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed if a future edit introduces direct posting, spending, or deployment in candidate-only modules.
          if grep -nEi '(gh workflow run|buffer\.com/api|api\.buffer\.com|stripe\.com|vercel deploy|publish_after_approval[[:space:]]*=[[:space:]]*true)' lib/daily-video-plan.mjs scripts/daily-video-candidate.mjs; then
            echo '::error::Candidate-only code contains a possible external action; independent review required.'
            exit 1
          fi
          echo 'Candidate-only files contain no matched external publishing/deploy commands.'
