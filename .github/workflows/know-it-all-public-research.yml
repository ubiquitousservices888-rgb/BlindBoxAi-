name: Know-It-All credentialless public research

on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

concurrency:
  group: know-it-all-public-research
  cancel-in-progress: true

jobs:
  research:
    name: Research public sources without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run credentialless public research
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          OPENAI_API_KEY: ""
          OPENAI_RESEARCH_MODEL: ""
          MR_RESEARCH_ENCRYPTION_KEY: ""
          MR_PRIVATE_BLOB_READ_WRITE_TOKEN: ""
        run: node scripts/secure-public-research.mjs

      - name: Verify research artifact contains no credential-like material
        shell: bash
        run: |
          set -euo pipefail
          artifact="data/know-it-all/latest-public-research.json"
          test -s "$artifact"
          ! grep -Eiq 'sk-(proj-)?[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN .*PRIVATE KEY-----' "$artifact"
          ! grep -Eiq '(OPENAI_API_KEY|MR_RESEARCH_ENCRYPTION_KEY|MR_PRIVATE_BLOB_READ_WRITE_TOKEN)[[:space:]]*[:=][[:space:]]*[^" ]+' "$artifact"

      - name: Upload sanitized public research artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: know-it-all-public-research
          path: data/know-it-all/latest-public-research.json
          if-no-files-found: error
          retention-days: 7

  persist:
    name: Persist sanitized public research through GitHub OIDC
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout persistence client without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Download public research artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: know-it-all-public-research
          path: data/know-it-all

      - name: Verify artifact again before persistence
        shell: bash
        run: |
          set -euo pipefail
          artifact="data/know-it-all/latest-public-research.json"
          test -s "$artifact"
          ! grep -Eiq 'sk-(proj-)?[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN .*PRIVATE KEY-----' "$artifact"
          ! grep -Eiq '(OPENAI_API_KEY|MR_RESEARCH_ENCRYPTION_KEY|MR_PRIVATE_BLOB_READ_WRITE_TOKEN)[[:space:]]*[:=][[:space:]]*[^" ]+' "$artifact"

      - name: Persist sanitized snapshot
        env:
          SUPABASE_URL: https://lazzdoadoqzrzlarerfx.supabase.co
        run: node scripts/persist-public-research.mjs data/know-it-all/latest-public-research.json
