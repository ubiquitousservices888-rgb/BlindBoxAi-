name: One-shot publish approved review to first channel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pokemon-youtube-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one real capped publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST             "repos/$GH_REPO/actions/workflows/publish-approved-reviews.yml/dispatches"             -f ref=main             -F inputs[dry_run]=false
