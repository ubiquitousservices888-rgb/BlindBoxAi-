name: Deploy Mr. Know It All ingest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mr-know-it-all-ingest
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Deploy mr-know-it-all-ingest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >
          npx --yes supabase@2.117.0 functions deploy mr-know-it-all-ingest
          --project-ref lazzdoadoqzrzlarerfx
          --no-verify-jwt
