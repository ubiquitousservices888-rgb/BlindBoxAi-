name: Narrative flywheel candidate (review only)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/narrative-flywheel.mjs"
      - "lib/ues-network-flywheel.mjs"
      - "scripts/narrative-flywheel-stage.mjs"
      - "scripts/narrative-flywheel.test.mjs"
      - "data/series/**"
      - "package.json"
      - ".github/workflows/narrative-flywheel-stage.yml"
  schedule:
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      priority_terms:
        description: "Comma-separated Narrative Flywheel priority terms for this manual review run"
        required: false
        default: "twinkle"
        type: string

permissions:
  contents: read

concurrency:
  group: blindboxai-narrative-flywheel-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: Build narrative candidate without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLINDBOXAI_PRIORITY_TERMS: ${{ github.event.inputs.priority_terms || 'twinkle' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test narrative safety rules
        run: node --test scripts/narrative-flywheel.test.mjs
      - name: Stage narrative candidate
        run: node scripts/narrative-flywheel-stage.mjs
      - name: Upload review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: narrative-flywheel-review
          path: output/narrative-flywheel
          retention-days: 7
          if-no-files-found: error
      - name: Confirm bounded operation
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const files = [
            "output/narrative-flywheel/candidate.json",
            "output/narrative-flywheel/ues-network-candidate.json",
          ];

          for (const file of files) {
            const candidate = JSON.parse(fs.readFileSync(file, "utf8"));
            if (candidate.state !== "READY_FOR_REVIEW") {
              throw new Error(`${file}: expected READY_FOR_REVIEW, got ${candidate.state}`);
            }
            if (candidate.publishAutomatically !== false) {
              throw new Error(`${file}: publishAutomatically must be false`);
            }
          }

          console.log("Narrative artifacts verified as review-only and non-publishing.");
          NODE
          echo "No social post, token, transaction, product purchase, or merchant URL was created."
