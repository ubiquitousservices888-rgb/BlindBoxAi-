name: One-shot publish approved TikTok then YouTube

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-approved-tiktok-then-youtube-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  publish-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Publish approved queue TikTok first, then YouTube
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          run_one() {
            channel="$1"
            echo "BATCH_CHANNEL_START: $channel"

            before="$(gh api "repos/$GH_REPO/actions/workflows/publish-approved-reviews.yml/runs?event=workflow_dispatch&branch=main&per_page=1" --jq '.workflow_runs[0].id // 0')"

            gh api --method POST               "repos/$GH_REPO/actions/workflows/publish-approved-reviews.yml/dispatches"               -f ref=main               -F inputs[dry_run]=false               -f "inputs[publish_channel]=$channel"

            run_id=""
            for _ in $(seq 1 60); do
              sleep 5
              run_id="$(gh api "repos/$GH_REPO/actions/workflows/publish-approved-reviews.yml/runs?event=workflow_dispatch&branch=main&per_page=20"                 --jq ".workflow_runs[] | select(.id > $before) | .id" | head -n1 || true)"
              if [ -n "$run_id" ]; then
                break
              fi
            done

            if [ -z "$run_id" ]; then
              echo "::error::No workflow_dispatch run appeared for $channel"
              exit 1
            fi

            echo "BATCH_CHILD_RUN: $channel:$run_id"

            for _ in $(seq 1 120); do
              state="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.status + ":" + (.conclusion // "")')"
              echo "BATCH_CHILD_STATE: $channel:$run_id:$state"
              if [[ "$state" == completed:* ]]; then
                conclusion="${state#completed:}"
                if [ "$conclusion" != "success" ]; then
                  echo "::error::$channel child run $run_id finished $conclusion"
                  exit 1
                fi
                return 0
              fi
              sleep 5
            done

            echo "::error::$channel child run $run_id timed out"
            exit 1
          }

          for _ in $(seq 1 7); do
            run_one tiktok
          done

          for _ in $(seq 1 7); do
            run_one youtube
          done

          echo "BATCH_COMPLETE: tiktok-first-then-youtube"
