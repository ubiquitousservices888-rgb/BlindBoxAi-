name: Disposable Buffer scheduling claim PostgREST contract

on:
  pull_request:
    paths:
      - "lib/buffer-review-daily-scheduler.mjs"
      - "lib/postgrest-review-schedule-store.mjs"
      - "scripts/buffer-review-daily-scheduler.test.mjs"
      - "tests/disposable-buffer-schedule-claim.integration.mjs"
      - ".github/workflows/disposable-buffer-schedule-claim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduling-claim-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d disposable"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 12
    steps:
      - name: Checkout exact PR version without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install disposable PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client
      - name: Create isolated test-only scheduling tables
        env:
          PGPASSWORD: disposable-only
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d disposable <<'SQL'
          CREATE ROLE web_anon NOLOGIN;
          CREATE TABLE public.review_schedule_claims (
            research_run_id text NOT NULL,
            channel text NOT NULL CHECK (channel IN ('youtube','tiktok')),
            channel_id text NOT NULL CHECK (length(trim(channel_id)) > 0),
            media_url text NOT NULL,
            status text NOT NULL CHECK (status IN ('claimed','scheduled')),
            buffer_post_id text,
            due_at timestamptz,
            PRIMARY KEY (research_run_id, channel)
          );
          CREATE TABLE public.review_publication_receipts (
            research_run_id text NOT NULL,
            channel text NOT NULL,
            public_url text NOT NULL,
            PRIMARY KEY (research_run_id, channel)
          );
          GRANT USAGE ON SCHEMA public TO web_anon;
          GRANT SELECT, INSERT, UPDATE, DELETE ON public.review_schedule_claims TO web_anon;
          GRANT SELECT, INSERT, UPDATE, DELETE ON public.review_publication_receipts TO web_anon;
          SQL
      - name: Launch ephemeral PostgREST without production credentials
        run: |
          docker run -d --rm --name disposable-buffer-postgrest --network host \
            -e PGRST_DB_URI="postgres://postgres:disposable-only@127.0.0.1:5432/disposable" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=web_anon \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.12@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
          for i in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:3000/review_schedule_claims >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Disposable PostgREST failed to become ready"
          exit 1
      - name: Test concurrent claims and receipt separation
        env:
          DISPOSABLE_POSTGREST_URL: http://127.0.0.1:3000
        run: node --test tests/disposable-buffer-schedule-claim.integration.mjs
      - name: Dispose of isolated runtime
        if: always()
        run: docker rm -f disposable-buffer-postgrest >/dev/null 2>&1 || true
