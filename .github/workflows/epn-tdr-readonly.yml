name: EPN official Transaction Detail API diagnostic (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epn-tdr-readonly-diagnostic
  cancel-in-progress: false

jobs:
  epn-readonly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      EPN_ACCOUNT_SID: ${{ secrets.EPN_ACCOUNT_SID }}
      EPN_REPORTING_ACCESS_TOKEN: ${{ secrets.EPN_REPORTING_ACCESS_TOKEN }}
      EPN_REPORTING_CURRENCY: ${{ vars.EPN_REPORTING_CURRENCY }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Inspect official EPN TDR without persistence or raw financial logs
        run: node scripts/epn-tdr-diagnostic.mjs
