name: Hair Salon verified video — owner approval only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hair-salon-owner-approval.yml

permissions:
  contents: read

concurrency:
  group: hair-salon-owner-approval
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify exact MP4 and stage approved review media
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      video_url: ${{ steps.stage.outputs.video_url }}
    env:
      SOURCE_VIDEO_URL: https://github.com/ubiquitousservices888-rgb/BlindBoxAi-/releases/download/blindbox-video-assets/2026-08-30-labubu-hair-salon-vinyl-plush-pendant-verified.mp4
      EXPECTED_SHA256: 7097fc885956f8b28cd38d942099ba8cb153f8b8adb68ce134cf311e14f996d0
      EXPECTED_SIZE: "121797"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Download and verify exact source asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 "$SOURCE_VIDEO_URL" --output hair-salon.mp4
          test "$(stat -c %s hair-salon.mp4)" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "hair-salon.mp4" | sha256sum --check -

          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 hair-salon.mp4)"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 hair-salon.mp4)"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 hair-salon.mp4)"

          node -e '
            const [duration, width, height] = process.argv.slice(1).map(Number);
            if (!Number.isFinite(duration) || duration < 1 || duration > 180) throw new Error("Video duration is not Shorts-eligible");
            if (width !== 720 || height !== 1280) throw new Error("Video dimensions changed from verified 720x1280");
          ' "$duration" "$width" "$height"

      - name: Wait for deployed content-addressed review media
        id: stage
        shell: bash
        env:
          VIDEO_URL: https://www.blindboxai.com/api/media/review/sha256-7097fc885956f8b28cd38d942099ba8cb153f8b8adb68ce134cf311e14f996d0.mp4
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --header "Cache-Control: no-cache" \
              "$VIDEO_URL" \
              --output served-hair-salon.mp4; then
              if [ "$(stat -c %s served-hair-salon.mp4)" = "$EXPECTED_SIZE" ] && \
                printf '%s  %s\n' "$EXPECTED_SHA256" "served-hair-salon.mp4" | sha256sum --check - >/dev/null 2>&1; then
                printf 'video_url=%s\n' "$VIDEO_URL" >> "$GITHUB_OUTPUT"
                {
                  printf '## Ready for owner approval\n\n'
                  printf '[Watch the exact content-addressed MP4](%s)\n\n' "$VIDEO_URL"
                  printf 'SHA-256 and byte size were verified from the public review URL. Publishing remains blocked behind **social-production**.\n'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            rm -f served-hair-salon.mp4
            if [ "$attempt" -lt 30 ]; then sleep 10; fi
          done

          echo "::error::The deployed content-addressed review URL did not become available with the verified bytes."
          exit 1

  publish-after-owner-approval:
    name: Blue approval → YouTube + TikTok → live verification
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: social-production
      url: ${{ needs.prepare.outputs.video_url }}
    env:
      REVIEWED_VIDEO_URL: ${{ needs.prepare.outputs.video_url }}
      REVIEWED_VIDEO_TITLE: THE MONSTERS Hair Salon Series — Vinyl Plush Pendant Blind Box
      RESEARCH_RUN_ID: rv-7097fc885956f8b2
      DRY_RUN: "false"
      YOUTUBE_AUDIENCE: not_made_for_kids
      VIDEO_CHANNELS: youtube,tiktok
      PUBLISHED_VIDEO_FEED_URL: https://lazzdoadoqzrzlarerfx.supabase.co/functions/v1/published-video-feed
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Re-verify approved content-addressed MP4 before publishing
        shell: bash
        env:
          VIDEO_URL: ${{ needs.prepare.outputs.video_url }}
          EXPECTED_SHA256: 7097fc885956f8b28cd38d942099ba8cb153f8b8adb68ce134cf311e14f996d0
          EXPECTED_SIZE: "121797"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --header "Cache-Control: no-cache" \
            "$VIDEO_URL" \
            --output approved-hair-salon.mp4
          test "$(stat -c %s approved-hair-salon.mp4)" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "approved-hair-salon.mp4" | sha256sum --check -

      - name: Verify publishing configuration
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
        run: |
          if [ -z "$BUFFER_API_TOKEN" ] || [ -z "$BUFFER_ORGANIZATION_ID" ]; then
            echo "::error::Buffer production configuration is incomplete."
            exit 1
          fi

      - name: Publish exact owner-approved video and require verified public URLs
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
        run: node scripts/publish-reviewed-upload.mjs
