name: Mr. Know It All deterministic compliance check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    name: Verify deterministic lookup and AI isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic comp tests
        run: node --test scripts/deterministic-comp-lookup.test.mjs
      - name: Enforce no public LLM dependency
        shell: bash
        run: |
          ! grep -q "askMrKnowItAll\|OPENAI_API_KEY" app/api/mr-know-it-all/route.js
          echo "Public Mr. Know It All is deterministic. No scheduled AI research is enabled."
