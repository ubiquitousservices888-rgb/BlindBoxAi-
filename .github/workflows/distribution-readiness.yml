name: BlindBoxAI distribution readiness

on:
  schedule:
    - cron: "15 4,16 * * *"
  workflow_dispatch:

concurrency:
  group: blindboxai-distribution-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Evaluate fresh-comp traffic gate
        run: node scripts/distribution-readiness.mjs

      - name: Verify readiness artifact contains no credential-shaped material
        shell: bash
        run: |
          set -euo pipefail
          artifact="data/distribution/latest-readiness.json"
          test -s "$artifact"
          ! grep -Eiq 'sk-(proj-)?[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN .*PRIVATE KEY-----' "$artifact"

      - name: Upload readiness report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-readiness
          path: data/distribution/latest-readiness.json
          if-no-files-found: error
          retention-days: 14
