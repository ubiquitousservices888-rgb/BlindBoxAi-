name: Labubu content validation (automation paused)

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    name: Validate Labubu content without scheduling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Labubu tests
        run: node --test scripts/labubu-test.mjs
      - name: Validate source data
        run: node scripts/labubu-validate.mjs --skip-url-check --output-dir output/labubu
      - name: Confirm scheduling is paused
        run: 'echo "P1 manual-validation phase: no Buffer CSV scheduling or publication occurs in this workflow."'
