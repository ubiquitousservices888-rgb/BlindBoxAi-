name: One-shot approved-review default dry-run dispatcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/review-publisher-default-dry-run-one-shot.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch approved-review publisher with defaults only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST             "repos/$GH_REPO/actions/workflows/publish-approved-reviews.yml/dispatches"             -f ref=main
