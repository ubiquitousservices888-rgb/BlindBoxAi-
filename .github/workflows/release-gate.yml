name: BlindBoxAI release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    name: Refresh dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when dependency metadata changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package lockfile for secure dependencies"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  preflight:
    name: Preflight
    needs: refresh-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository, environment-name, and credential preflight
        run: npm run predeploy

  test:
    name: Test
    needs: refresh-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_EPN_CAMPID: ${{ secrets.NEXT_PUBLIC_EPN_CAMPID }}
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all safety tests
        run: npm test
      - name: Validate generated and source data
        run: npm run validate
        env:
          NEXT_PUBLIC_EPN_CAMPID: ${{ secrets.NEXT_PUBLIC_EPN_CAMPID }}

  build:
    name: Build
    needs: refresh-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: Audit
    needs: refresh-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit eBay EPN and Skimlinks policy
        run: npm run audit:epn
      - name: Block high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
