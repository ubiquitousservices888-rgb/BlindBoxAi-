name: temporary lock sync

on:
  push:
    branches:
      - feat/vertical-attribution

permissions:
  contents: write

jobs:
  sync:
    if: github.actor == 'ubiquitousservices888-rgb'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/vertical-attribution
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/temporary-lock-sync.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git commit -m "chore: sync npm lockfile with package manifest"
          git push origin HEAD:feat/vertical-attribution
