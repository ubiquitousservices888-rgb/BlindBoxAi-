name: Deploy publishing gate Edge Functions

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/blindbox-video-upload/**
      - supabase/functions/review-video-queue/**
      - supabase/functions/_shared/**
      - supabase/functions/published-video-feed/**
      - .github/workflows/deploy-publishing-gate-functions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-publishing-gate-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Deploy review storage broker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >
          npx --yes supabase@2.117.0 functions deploy blindbox-video-upload
          --project-ref lazzdoadoqzrzlarerfx
          --no-verify-jwt

      - name: Deploy canonical review queue
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >
          npx --yes supabase@2.117.0 functions deploy review-video-queue
          --project-ref lazzdoadoqzrzlarerfx
          --no-verify-jwt

      - name: Deploy published video feed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >
          npx --yes supabase@2.117.0 functions deploy published-video-feed
          --project-ref lazzdoadoqzrzlarerfx
          --no-verify-jwt
