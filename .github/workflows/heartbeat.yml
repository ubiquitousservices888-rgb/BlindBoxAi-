name: BlindBoxAI heartbeat

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production web
        run: curl --fail --silent --show-error --max-time 20 https://www.blindboxai.com/ >/dev/null
      - name: Check latest mislisting scanner run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GH_REPO/actions/workflows/mislisting-scanner.yml/runs?per_page=1")"
          count="$(jq -r '.total_count // 0' <<<"$payload")"
          test "$count" -ge 1
          conclusion="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$payload")"
          started="$(jq -r '.workflow_runs[0].run_started_at // ""' <<<"$payload")"
          test "$conclusion" = "success"
          STARTED="$started" node --input-type=module <<'NODE'
          const started=Date.parse(process.env.STARTED||"");
          if(!Number.isFinite(started)) throw new Error("Scanner start time missing");
          const ageHours=(Date.now()-started)/3600000;
          if(ageHours>30) throw new Error(`Scanner stale: ${ageHours.toFixed(1)}h`);
          console.log(`SCANNER_AGE_HOURS=${ageHours.toFixed(1)}`);
          NODE
