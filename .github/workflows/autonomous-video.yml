name: Video pipeline compliance gate (publishing paused)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-only:
    name: Validate deterministic video assets only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run video:test
      - run: node scripts/video-pipeline.mjs validate
      - name: Confirm publishing is intentionally disabled
        run: |
          echo "P0 compliance hold: this workflow validates only."
          echo "No Zapier webhook, renderer, Buffer publisher, TikTok API, YouTube API, or generative AI is invoked."
