name: Autonomous verified video pipeline

on:
  push:
    branches: [main]
    paths:
      - data/verified-video-products.json
      - scripts/zapier-video-payload.mjs
      - package.json
      - .github/workflows/autonomous-video.yml
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CREATOMATE_TEMPLATE_ID: 8b360817-3e33-40e3-bbb4-55a8b508f06e
  VIDEO_CHANNELS: twitter,tiktok

jobs:
  validate:
    name: Validate video pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npm audit --audit-level=high

  prepare-zapier:
    name: Prepare verified Zapier video request
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build verified Zapier payload
        run: npm run video:zapier
        env:
          ZAPIER_VIDEO_WEBHOOK_URL: ${{ secrets.ZAPIER_VIDEO_WEBHOOK_URL }}
      - name: Add handoff summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync("output/zapier/video-request.json", "utf8"));
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Verified video request ready for Zapier\n\n` +
            `**Request:** ${payload.id}\n\n` +
            `**Product:** ${payload.product.name}\n\n` +
            `**Approval required:** yes\n\n` +
            `GitHub no longer calls Creatomate or Buffer directly. Zapier owns render, approval, and publishing.\n`,
          );
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: zapier-video-request-${{ github.run_id }}
          path: output/zapier/video-request.json
          if-no-files-found: error
          retention-days: 30
