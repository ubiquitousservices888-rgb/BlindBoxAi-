name: Autonomous verified video pipeline

on:
  push:
    branches: [main]
    paths:
      - data/verified-video-products.json
  workflow_dispatch:
    inputs:
      publish_after_approval:
        description: "After staging, allow the protected owner-approval publish job to become eligible"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate verified video inputs
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_EPN_CAMPID: "5339171775"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run video safety tests
        run: npm run video:test
      - name: Validate verified video source data
        run: node scripts/video-pipeline.mjs validate

  render:
    name: Render one verified video for review
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      video_url: ${{ steps.review.outputs.video_url }}
      research_run_id: ${{ steps.review.outputs.research_run_id }}
      campaign_id: ${{ steps.review.outputs.campaign_id }}
      state_b64: ${{ steps.review.outputs.state_b64 }}
    env:
      NEXT_PUBLIC_EPN_CAMPID: "5339171775"
      CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
      CREATOMATE_TEMPLATE_ID: ${{ vars.CREATOMATE_TEMPLATE_ID || '8b360817-3e33-40e3-bbb4-55a8b508f06e' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GEMINI_VIDEO_RESOLUTION: ${{ vars.GEMINI_VIDEO_RESOLUTION || '360p' }}
      ALLOW_MANUAL_VIDEO_RENDER: "true"
      ALLOW_GEMINI_VIDEO_RENDER: "true"
      ALLOW_MANUAL_VIDEO_PUBLISH: "false"
      VIDEO_CHANNELS: ${{ vars.VIDEO_CHANNELS || 'youtube,tiktok' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Render verified video with production-quality provider
        shell: bash
        run: |
          set +e
          creatomate_status=1
          if [ -n "$CREATOMATE_API_KEY" ]; then
            echo "Trying Creatomate renderer..."
            npm run video:daily
            creatomate_status=$?
          fi

          if [ "$creatomate_status" -eq 0 ]; then
            echo "VIDEO_RENDER_PROVIDER=creatomate"
            exit 0
          fi

          gemini_status=1
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "Creatomate unavailable; trying guarded Gemini renderer..."
            npm run video:gemini-stage
            gemini_status=$?
          fi
          set -e

          if [ "$gemini_status" -eq 0 ]; then
            echo "VIDEO_RENDER_PROVIDER=gemini-omni"
            exit 0
          fi

          echo "::error::No production-quality video renderer succeeded. Text-only deterministic fallback is disabled. Nothing will be sent to review or Buffer."
          exit 1
      - name: Enforce production video quality gate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "output/video-pipeline/state.json";
          if (!fs.existsSync(file)) throw new Error("Renderer did not produce review state");
          const state = JSON.parse(fs.readFileSync(file, "utf8"));
          const provider = state?.render?.provider ?? "";
          const videoUrl = state?.render?.videoUrl ?? "";
          const blocked = new Set(["deterministic-ffmpeg", "text-card", "placeholder", "mock", "simulated"]);
          if (blocked.has(provider)) throw new Error(`Blocked low-quality renderer reached review state: ${provider}`);
          if (!provider) throw new Error("Render provider is missing");
          if (!/^https:\/\/.+\.mp4(?:\?.*)?$/i.test(videoUrl)) throw new Error("Production review video must be a hosted HTTPS MP4");
          if (state?.state !== "READY_FOR_REVIEW") throw new Error("Renderer output is not READY_FOR_REVIEW");
          console.log(`QUALITY_GATE_PROVIDER=${provider}`);
          console.log(`QUALITY_GATE_VIDEO_URL=${videoUrl}`);
          NODE
      - name: Ensure video probe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffprobe >/dev/null 2>&1
          ffprobe -version | head -n 1
      - name: Stage verified render in canonical review storage
        id: canonical
        env:
          STAGE_RENDER_URL: https://www.blindboxai.com/api/owner/stage-render
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";

          const MAX_BYTES = 100 * 1024 * 1024;
          const file = "output/video-pipeline/state.json";
          const state = JSON.parse(fs.readFileSync(file, "utf8"));
          const sourceVideoUrl = String(state?.render?.videoUrl ?? "");
          const title = String(state?.script?.displayTitle || state?.script?.title || "").trim();

          function allowedRendererUrl(value) {
            try {
              const url = new URL(String(value || ""));
              if (url.protocol !== "https:" || url.port || !/\.mp4$/i.test(url.pathname)) return "";
              const host = url.hostname.toLowerCase();
              const creatomateBackblaze =
                /^f\d{3}\.backblazeb2\.com$/.test(host) &&
                url.pathname.startsWith("/file/creatomate-");
              const creatomateCdn =
                host === "cdn.creatomate.com" &&
                url.pathname.startsWith("/renders/");
              const vercelBlob = host.endsWith(".public.blob.vercel-storage.com");
              return creatomateBackblaze || creatomateCdn || vercelBlob ? url.toString() : "";
            } catch {
              return "";
            }
          }

          async function readBounded(url) {
            const response = await fetch(url, { redirect: "error" });
            if (!response.ok) throw new Error(`Unable to download MP4: ${response.status}`);
            if (!response.body) throw new Error("MP4 response body is missing");
            const chunks = [];
            let sizeBytes = 0;
            for await (const chunk of response.body) {
              const buffer = Buffer.from(chunk);
              sizeBytes += buffer.length;
              if (sizeBytes > MAX_BYTES) throw new Error("MP4 exceeds the review size limit");
              chunks.push(buffer);
            }
            if (sizeBytes <= 0) throw new Error("MP4 is empty");
            return Buffer.concat(chunks, sizeBytes);
          }

          function ffprobe(bytes, path) {
            fs.writeFileSync(path, bytes);
            const probe = JSON.parse(execFileSync("ffprobe", [
              "-v", "error",
              "-select_streams", "v:0",
              "-show_entries", "stream=width,height:format=duration",
              "-of", "json",
              path,
            ], { encoding: "utf8" }));
            const stream = Array.isArray(probe?.streams) ? probe.streams[0] : null;
            const durationSeconds = Number(probe?.format?.duration);
            const width = Number(stream?.width);
            const height = Number(stream?.height);
            if (![durationSeconds, width, height].every((value) => Number.isFinite(value) && value > 0)) {
              throw new Error("ffprobe did not return valid duration and dimensions");
            }
            return { durationSeconds, width, height };
          }

          if (!allowedRendererUrl(sourceVideoUrl)) {
            throw new Error("Rendered review URL is outside the approved renderer allowlist");
          }
          if (!title) throw new Error("Rendered review title is missing");

          const sourceBytes = await readBounded(sourceVideoUrl);
          const sourceProbe = ffprobe(sourceBytes, "/tmp/blindboxai-render-source.mp4");

          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set("audience", "blindboxai-autonomous-render-stage");
          const oidcResponse = await fetch(oidcUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!oidcResponse.ok) throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`);
          const oidcBody = await oidcResponse.json();
          const oidcToken = String(oidcBody?.value || "");
          if (!oidcToken) throw new Error("GitHub OIDC token response was empty");

          async function stageRequest(payload, { maxWaitMs = 30000, retryRevision = false } = {}) {
            const deadline = Date.now() + maxWaitMs;
            let response = null;
            let body = {};
            while (Date.now() < deadline) {
              const remainingMs = deadline - Date.now();
              const controller = new AbortController();
              const requestTimeout = setTimeout(
                () => controller.abort(),
                Math.max(1, Math.min(15000, remainingMs)),
              );
              try {
                response = await fetch(process.env.STAGE_RENDER_URL, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${oidcToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify(payload),
                  signal: controller.signal,
                });
                body = await response.json().catch(() => ({}));
              } catch (error) {
                body = {
                  error: error?.name === "AbortError" ? "stage_render_request_timeout" : "stage_render_request_failed",
                };
                response = null;
              } finally {
                clearTimeout(requestTimeout);
              }

              if (response?.ok) return { response, body };
              const revisionPending =
                response?.status === 409 && body?.error === "production_revision_not_ready";
              if (!retryRevision || (!revisionPending && response !== null)) {
                return { response, body };
              }

              const sleepMs = Math.min(5000, deadline - Date.now());
              if (sleepMs <= 0) break;
              await new Promise((resolve) => setTimeout(resolve, sleepMs));
            }
            return {
              response,
              body: {
                ...body,
                error: body?.error || "production_revision_timeout",
              },
            };
          }

          const upload = await stageRequest({
            action: "upload",
            sourceVideoUrl,
            title,
            sizeBytes: sourceBytes.length,
            durationSeconds: sourceProbe.durationSeconds,
            width: sourceProbe.width,
            height: sourceProbe.height,
          }, { maxWaitMs: 240000, retryRevision: true });

          if (!upload.response?.ok || upload.body?.state !== "CANONICAL_UPLOADED") {
            throw new Error(
              `Canonical upload failed: ${upload.response?.status || 0} ${upload.body?.error || "unknown"}`,
            );
          }

          const canonicalVideoUrl = String(upload.body.videoUrl || "");
          const canonicalPath = String(upload.body.path || "");
          let staged = null;
          try {
            if (!/^https:\/\/lazzdoadoqzrzlarerfx\.supabase\.co\/storage\/v1\/object\/public\/blindboxai-review-videos\/media\/review\/.+\.mp4$/i.test(canonicalVideoUrl)) {
              throw new Error("Canonical upload returned an unapproved media URL");
            }
            if (!/^media\/review\/[a-zA-Z0-9._-]+\.mp4$/i.test(canonicalPath)) {
              throw new Error("Canonical upload returned an invalid storage path");
            }

            const canonicalBytes = await readBounded(canonicalVideoUrl);
            const canonicalProbe = ffprobe(canonicalBytes, "/tmp/blindboxai-canonical-review.mp4");
            if (canonicalBytes.length !== sourceBytes.length) {
              throw new Error("Canonical review MP4 size differs from the ffprobed renderer MP4");
            }
            if (canonicalProbe.width !== sourceProbe.width || canonicalProbe.height !== sourceProbe.height) {
              throw new Error("Canonical review MP4 dimensions differ from the ffprobed renderer MP4");
            }
            if (Math.abs(canonicalProbe.durationSeconds - sourceProbe.durationSeconds) > 0.05) {
              throw new Error("Canonical review MP4 duration differs from the ffprobed renderer MP4");
            }

            const sha256 = createHash("sha256").update(canonicalBytes).digest("hex");
            staged = await stageRequest({
              action: "stage",
              videoUrl: canonicalVideoUrl,
              path: canonicalPath,
              title,
              sha256,
              sizeBytes: canonicalBytes.length,
              durationSeconds: canonicalProbe.durationSeconds,
              width: canonicalProbe.width,
              height: canonicalProbe.height,
            }, { maxWaitMs: 30000, retryRevision: true });

            if (!staged.response?.ok || staged.body?.state !== "READY_FOR_REVIEW") {
              throw new Error(
                `Canonical review staging failed: ${staged.response?.status || 0} ${staged.body?.error || "unknown"}`,
              );
            }
          } catch (error) {
            try {
              await stageRequest({
                action: "cleanup",
                videoUrl: canonicalVideoUrl,
                path: canonicalPath,
              }, { maxWaitMs: 15000 });
            } catch {}
            throw error;
          }

          const body = staged.body;
          if (!/^rv-[a-f0-9]{16}$/.test(String(body.researchRunId || ""))) {
            throw new Error("Canonical review staging returned an invalid researchRunId");
          }
          if (body.campaignId !== `bb-${body.researchRunId}`) {
            throw new Error("Canonical review staging returned an invalid campaignId");
          }

          state.render.sourceVideoUrl = sourceVideoUrl;
          state.render.videoUrl = body.videoUrl;
          state.review = {
            researchRunId: body.researchRunId,
            campaignId: body.campaignId,
            sha256: body.sha256,
            sizeBytes: body.sizeBytes,
            durationSeconds: body.durationSeconds,
            width: body.width,
            height: body.height,
            stagedAt: new Date().toISOString(),
          };
          state.updatedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(state, null, 2) + "\n");

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `video_url=${body.videoUrl}\nresearch_run_id=${body.researchRunId}\ncampaign_id=${body.campaignId}\n`,
          );
          console.log(`CANONICAL_REVIEW_VIDEO_URL=${body.videoUrl}`);
          console.log(`CANONICAL_REVIEW_RESEARCH_RUN=${body.researchRunId}`);
          console.log(`CANONICAL_REVIEW_CAMPAIGN=${body.campaignId}`);
          NODE
      - name: Prepare exact review state
        id: review
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "output/video-pipeline/state.json";
          const state = JSON.parse(fs.readFileSync(file, "utf8"));
          const videoUrl = state?.render?.videoUrl;
          const provider = state?.render?.provider;
          const researchRunId = state?.review?.researchRunId;
          const campaignId = state?.review?.campaignId;
          const blocked = new Set(["deterministic-ffmpeg", "text-card", "placeholder", "mock", "simulated"]);
          if (state?.state !== "READY_FOR_REVIEW") throw new Error("Video is not READY_FOR_REVIEW");
          if (blocked.has(provider)) throw new Error(`Low-quality renderer cannot enter review: ${provider}`);
          if (!/^https:\/\/lazzdoadoqzrzlarerfx\.supabase\.co\/storage\/v1\/object\/public\/blindboxai-review-videos\/media\/review\/.+\.mp4$/i.test(videoUrl ?? "")) {
            throw new Error("Review URL must use the canonical Supabase review namespace");
          }
          if (!/^rv-[a-f0-9]{16}$/.test(String(researchRunId || ""))) throw new Error("Review researchRunId is missing");
          if (campaignId !== `bb-${researchRunId}`) throw new Error("Review campaignId is missing");
          const stateB64 = Buffer.from(JSON.stringify(state), "utf8").toString("base64");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `video_url=${videoUrl}\nresearch_run_id=${researchRunId}\ncampaign_id=${campaignId}\nstate_b64=${stateB64}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Production-quality video ready for review\n\n[Watch the canonical review MP4](${videoUrl})\n\nRenderer: ${provider}\n\nResearch run: ${researchRunId}\n\nCampaign: ${campaignId}\n\nThis run is stopped behind the social-production approval gate. Approve only if the visuals, audio, caption, and CTA are acceptable.\n`,
          );
          NODE
      - name: Upload review receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ready-for-review-${{ github.run_id }}
          path: output/video-pipeline/state.json
          if-no-files-found: error
          retention-days: 30

  publish-after-approval:
    name: Owner approval → verified public publish
    if: needs.render.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_after_approval == true
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: social-production
      url: ${{ needs.render.outputs.video_url }}
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: autonomous-video-buffer-publish
      cancel-in-progress: false
    env:
      DRY_RUN: "false"
      VIDEO_CHANNELS: youtube,tiktok
      PUBLISH_RESEARCH_RUN_ID: ${{ needs.render.outputs.research_run_id }}
      YOUTUBE_AUDIENCE: not_made_for_kids
      BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure video probe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffprobe >/dev/null 2>&1
      - name: Restore and verify exact reviewed state
        env:
          REVIEWED_STATE_B64: ${{ needs.render.outputs.state_b64 }}
          REVIEWED_VIDEO_URL: ${{ needs.render.outputs.video_url }}
          REVIEWED_RESEARCH_RUN_ID: ${{ needs.render.outputs.research_run_id }}
        shell: bash
        run: |
          mkdir -p output/video-pipeline
          printf '%s' "$REVIEWED_STATE_B64" | base64 --decode > output/video-pipeline/state.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const state = JSON.parse(fs.readFileSync("output/video-pipeline/state.json", "utf8"));
          const blocked = new Set(["deterministic-ffmpeg", "text-card", "placeholder", "mock", "simulated"]);
          if (state?.state !== "READY_FOR_REVIEW") throw new Error("Reviewed state is not READY_FOR_REVIEW");
          if (blocked.has(state?.render?.provider)) throw new Error(`Blocked renderer cannot be published: ${state?.render?.provider}`);
          if (state?.render?.videoUrl !== process.env.REVIEWED_VIDEO_URL) throw new Error("Reviewed video URL changed before publication");
          if (state?.review?.researchRunId !== process.env.REVIEWED_RESEARCH_RUN_ID) throw new Error("Reviewed research ID changed before publication");
          if (state?.review?.campaignId !== `bb-${process.env.REVIEWED_RESEARCH_RUN_ID}`) throw new Error("Reviewed campaign ID changed before publication");
          NODE
      - name: Verify Buffer configuration
        shell: bash
        run: |
          if [ -z "$BUFFER_API_TOKEN" ] || [ -z "$BUFFER_ORGANIZATION_ID" ]; then
            echo "::error::Buffer is not configured. BUFFER_API_TOKEN and BUFFER_ORGANIZATION_ID are required."
            exit 1
          fi
      - name: Approve exact canonical review row after owner gate
        env:
          STAGE_RENDER_URL: https://www.blindboxai.com/api/owner/stage-render
          REVIEWED_VIDEO_URL: ${{ needs.render.outputs.video_url }}
          REVIEWED_RESEARCH_RUN_ID: ${{ needs.render.outputs.research_run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set("audience", "blindboxai-autonomous-render-stage");
          const oidcResponse = await fetch(oidcUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!oidcResponse.ok) throw new Error(`GitHub OIDC request failed: ${oidcResponse.status}`);
          const oidcBody = await oidcResponse.json();
          const token = String(oidcBody?.value || "");
          if (!token) throw new Error("GitHub OIDC token response was empty");

          const deadline = Date.now() + 240000;
          let response = null;
          let body = {};
          while (Date.now() < deadline) {
            const remainingMs = deadline - Date.now();
            const controller = new AbortController();
            const requestTimeout = setTimeout(
              () => controller.abort(),
              Math.max(1, Math.min(15000, remainingMs)),
            );
            try {
              response = await fetch(process.env.STAGE_RENDER_URL, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  action: "approve",
                  researchRunId: process.env.REVIEWED_RESEARCH_RUN_ID,
                  videoUrl: process.env.REVIEWED_VIDEO_URL,
                }),
                signal: controller.signal,
              });
              body = await response.json().catch(() => ({}));
            } catch (error) {
              body = {
                error: error?.name === "AbortError" ? "approval_request_timeout" : "approval_request_failed",
              };
              response = null;
            } finally {
              clearTimeout(requestTimeout);
            }
            if (response?.ok) break;
            if (response !== null && (response.status !== 409 || body?.error !== "production_revision_not_ready")) break;
            const sleepMs = Math.min(5000, deadline - Date.now());
            if (sleepMs <= 0) break;
            await new Promise((resolve) => setTimeout(resolve, sleepMs));
          }
          if (!response?.ok || body?.state !== "APPROVED") {
            throw new Error(`Canonical review approval failed: ${response?.status || 0} ${body?.error || "unknown"}`);
          }
          if (body.researchRunId !== process.env.REVIEWED_RESEARCH_RUN_ID) {
            throw new Error("Approved research ID does not match the reviewed asset");
          }
          console.log(`CANONICAL_REVIEW_APPROVED=${body.researchRunId}`);
          NODE
      - name: Publish and verify YouTube
        env:
          PUBLISH_CHANNEL: youtube
        run: node scripts/publish-approved-review-queue.mjs
      - name: Publish and verify TikTok
        env:
          PUBLISH_CHANNEL: tiktok
        run: node scripts/publish-approved-review-queue.mjs
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: video-publication-${{ github.run_id }}
          path: output/video-pipeline/state.json
          if-no-files-found: error
          retention-days: 30
