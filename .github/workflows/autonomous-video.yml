name: Autonomous verified video pipeline

on:
  push:
    branches: [main]
    paths:
      - data/verified-video-products.json
      - .github/workflows/autonomous-video.yml
      - scripts/deterministic-video-stage.mjs
      - package.json
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate verified video inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run video safety tests
        run: npm run video:test
      - name: Validate verified video source data
        run: node scripts/video-pipeline.mjs validate

  render:
    name: Render one verified video for review
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      video_url: ${{ steps.review.outputs.video_url }}
      state_b64: ${{ steps.review.outputs.state_b64 }}
    env:
      CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
      CREATOMATE_TEMPLATE_ID: ${{ vars.CREATOMATE_TEMPLATE_ID || '8b360817-3e33-40e3-bbb4-55a8b508f06e' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      GEMINI_VIDEO_RESOLUTION: ${{ vars.GEMINI_VIDEO_RESOLUTION || '360p' }}
      VIDEO_ASSET_RELEASE_TAG: blindbox-video-assets
      ALLOW_MANUAL_VIDEO_RENDER: "true"
      ALLOW_GEMINI_VIDEO_RENDER: "true"
      ALLOW_MANUAL_VIDEO_PUBLISH: "false"
      VIDEO_CHANNELS: ${{ vars.VIDEO_CHANNELS || 'youtube,tiktok' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify free fallback renderer
        shell: bash
        run: |
          command -v ffmpeg >/dev/null 2>&1 || {
            echo "::error::ffmpeg is required for the free deterministic video fallback."
            exit 1
          }
          ffmpeg -hide_banner -version | head -1
      - name: Render verified video with automatic fallback
        shell: bash
        run: |
          set +e
          creatomate_status=1
          if [ -n "$CREATOMATE_API_KEY" ]; then
            echo "Trying Creatomate renderer..."
            npm run video:daily
            creatomate_status=$?
          fi

          if [ "$creatomate_status" -eq 0 ]; then
            echo "VIDEO_RENDER_PROVIDER=creatomate"
            exit 0
          fi

          gemini_status=1
          if [ -n "$GEMINI_API_KEY" ] && [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "Creatomate unavailable; trying guarded Gemini renderer..."
            npm run video:gemini-stage
            gemini_status=$?
          fi
          set -e

          if [ "$gemini_status" -eq 0 ]; then
            echo "VIDEO_RENDER_PROVIDER=gemini-omni"
            exit 0
          fi

          echo "Cloud renderers unavailable; using free deterministic ffmpeg fallback."
          npm run video:deterministic-stage
      - name: Host deterministic review MP4 on GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          provider="$(node -p 'require("./output/video-pipeline/state.json").render.provider')"
          if [ "$provider" != "deterministic-ffmpeg" ]; then
            echo "Cloud renderer produced the hosted MP4; no release upload needed."
            exit 0
          fi

          asset="$(node -p 'require("./output/video-pipeline/state.json").render.assetFilename')"
          video_url="$(node -p 'require("./output/video-pipeline/state.json").render.videoUrl')"
          local_file="output/video-pipeline/$asset"

          test -s "$local_file" || {
            echo "::error::Deterministic MP4 is missing."
            exit 1
          }

          if ! gh release view "$VIDEO_ASSET_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$VIDEO_ASSET_RELEASE_TAG" \
              --title "BlindBoxAI verified video assets" \
              --notes "Machine-generated review assets for the guarded BlindBoxAI video pipeline. Publishing still requires owner approval."
          fi
          gh release upload "$VIDEO_ASSET_RELEASE_TAG" "$local_file" --clobber

          curl --fail --location --silent --show-error --head "$video_url" >/dev/null
          echo "Hosted deterministic review MP4: $video_url"
      - name: Prepare exact review state
        id: review
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const file = "output/video-pipeline/state.json";
          const state = JSON.parse(fs.readFileSync(file, "utf8"));
          const videoUrl = state?.render?.videoUrl;
          if (state?.state !== "READY_FOR_REVIEW") throw new Error("Video is not READY_FOR_REVIEW");
          if (!/^https:\/\/.+\.mp4(?:\?.*)?$/i.test(videoUrl ?? "")) throw new Error("Review URL must be a hosted HTTPS MP4");
          const stateB64 = Buffer.from(JSON.stringify(state), "utf8").toString("base64");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `video_url=${videoUrl}\nstate_b64=${stateB64}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Video ready for review\n\n[Watch the exact MP4](${videoUrl})\n\nThis run is stopped behind the social-production approval gate. Approve only if the video and caption are acceptable; approval sends this exact state to Buffer.\n`,
          );
          NODE
      - name: Upload review receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ready-for-review-${{ github.run_id }}
          path: output/video-pipeline/state.json
          if-no-files-found: error
          retention-days: 30

  publish-after-approval:
    name: Owner approval → Buffer queue
    if: needs.render.result == 'success' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: social-production
      url: ${{ needs.render.outputs.video_url }}
    permissions:
      contents: read
      actions: read
    concurrency:
      group: autonomous-video-buffer-publish
      cancel-in-progress: false
    env:
      ALLOW_MANUAL_VIDEO_PUBLISH: "true"
      BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore exact reviewed state
        env:
          REVIEWED_STATE_B64: ${{ needs.render.outputs.state_b64 }}
          REVIEWED_VIDEO_URL: ${{ needs.render.outputs.video_url }}
        shell: bash
        run: |
          mkdir -p output/video-pipeline
          printf '%s' "$REVIEWED_STATE_B64" | base64 --decode > output/video-pipeline/state.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const state = JSON.parse(fs.readFileSync("output/video-pipeline/state.json", "utf8"));
          if (state?.state !== "READY_FOR_REVIEW") throw new Error("Reviewed state is not READY_FOR_REVIEW");
          if (state?.render?.videoUrl !== process.env.REVIEWED_VIDEO_URL) throw new Error("Reviewed video URL changed before publication");
          NODE
      - name: Verify Buffer configuration
        shell: bash
        run: |
          if [ -z "$BUFFER_API_TOKEN" ] || [ -z "$BUFFER_ORGANIZATION_ID" ]; then
            echo "::error::Buffer is not configured. BUFFER_API_TOKEN and BUFFER_ORGANIZATION_ID are required."
            exit 1
          fi
      - name: Record owner approval
        run: npm run video:approve
      - name: Queue approved video through Buffer
        run: npm run video:publish
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: video-publication-${{ github.run_id }}
          path: output/video-pipeline/state.json
          if-no-files-found: error
          retention-days: 30
