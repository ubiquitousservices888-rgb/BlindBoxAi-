name: Verified visual asset discovery

on:
  schedule:
    - cron: "23 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/verified-video-products.json
      - scripts/verified-visual-discovery.mjs
      - scripts/verified-visual-discovery.test.mjs
      - lib/verified-visual-asset.mjs
      - .github/workflows/verified-visual-discovery.yml

permissions:
  contents: read
  actions: read

jobs:
  discover:
    name: Discover real official-source visual candidates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run visual:test
      - run: npm run visual:discover
      - name: Upload private review artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-visual-candidates-${{ github.run_id }}
          path: output/visuals/candidates.json
          if-no-files-found: error
          retention-days: 14
