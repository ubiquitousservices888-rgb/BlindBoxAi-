name: Visual rights validation (discovery paused)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-only:
    name: Validate approved visual rules only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run visual:test
      - name: Confirm discovery is intentionally paused
        run: echo "Use owner-created SVG explanation graphics and explicitly licensed/official photography only. No automated visual discovery runs."
