name: PR97 lockfile sync

on:
  push:
    branches:
      - feat/vertical-attribution
    paths:
      - .github/workflows/pr97-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/vertical-attribution
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify root dependency pins are synchronized
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const root = lock.packages?.['']?.dependencies || {};
          for (const [name, version] of Object.entries(pkg.dependencies || {})) {
            if (root[name] !== version) {
              throw new Error(`lock mismatch for ${name}`);
            }
          }
          console.log('package.json and package-lock.json root dependencies are synchronized');
          NODE

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize dependency lockfile"
          git push origin HEAD:feat/vertical-attribution
