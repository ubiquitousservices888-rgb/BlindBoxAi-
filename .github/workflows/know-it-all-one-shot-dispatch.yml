name: One-shot Know-It-All dispatcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/know-it-all-one-shot-dispatch.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[know-it-all-one-shot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch secured Know-It-All workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run know-it-all-public-research.yml --ref main --repo "$GITHUB_REPOSITORY"
